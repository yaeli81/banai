<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BanAI Wardrobe Designer</title>
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="topbar__title" id="topbar-logo" aria-label="BanAI Wardrobe Designer"></h1>
      <div class="topbar__actions">
        <label class="toggle">
          <input type="checkbox" id="toggle-interior" />
          <span>Show interior</span>
        </label>
        <span class="topbar__units">cm</span>
        <button type="button" class="btn btn--tonal" id="carpenter-pdf" data-testid="carpenter-pdf"
          title="Download a dimensioned spec sheet for the carpenter (PDF)">Carpenter PDF</button>
        <button type="button" class="btn btn--tonal" id="open-render" data-testid="open-render">Render</button>
        <button type="button" class="btn btn--primary" id="open-save" data-testid="open-save">Save</button>
      </div>
    </header>
    <div class="banner banner--error" id="error-banner" role="alert" hidden></div>
    <main class="workspace">
      <aside class="panel" id="chat-panel" aria-label="AI designer"></aside>
      <section class="viewer" id="viewer" aria-label="3D viewer"></section>
      <aside class="panel panel--properties" id="properties-panel" aria-label="Properties">
        <h2 class="panel__title">Properties</h2>
        <p class="panel__hint">Click a component in the 3D view to edit it.</p>
        <div id="properties-content"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
